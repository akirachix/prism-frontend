name: CI

on:
  pull_request:
    types:
      [
        opened,
        edited,
        reopened,
        synchronize,
        ready_for_review,
        converted_to_draft,
      ]
  push:
    branches:
      - main
      - master

jobs:
  ready-checklist:
    name: Ready for Review checklist
    runs-on: [self-hosted, classroom-ci]
    steps:
      - name: Verify checklist is complete before review
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            if (pr.draft) {
              core.info('PR is still a draft, skipping checklist check.');
              return;
            }

            const body = pr.body || '';
            const match = body.match(/## Ready for Review([\s\S]*?)(\n#{1,2} |$)/);

            if (!match) {
              core.setFailed('The "Ready for Review" section is missing from the PR description. Please use the PR template.');
              return;
            }

            const unchecked = match[1]
              .split('\n')
              .filter((line) => /^\s*[-*] \[ \]/.test(line))
              .map((line) => line.replace(/^\s*[-*] \[ \]\s*/, ''));

            if (unchecked.length > 0) {
              core.setFailed(
                'This PR was marked as ready for review, but these items are not done yet:\n' +
                unchecked.map((item) => `  - ${item}`).join('\n') +
                '\n\nComplete them (or convert the PR back to draft) before requesting review.'
              );
              return;
            }

            core.info('All Ready for Review items are checked.');

  validation:
    name: Build, lint, test, and format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --runInBand

      - name: Format check
        run: npm run format:check
