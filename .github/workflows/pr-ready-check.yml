name: PR Ready Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: pr-ready-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ready-checklist:
    name: Ready for Review checklist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify checklist and tick the items CI can check
        uses: actions/github-script@v7
        with:
          script: |
            const run = require('./.github/scripts/pr-ready-check.js');
            await run({ github, context, core });
