name: Frontend CI

on:
  push:
    branches:
      - develop
      - main
      - project-setup
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  build-lint-format-test:
    name: Build, Lint, Format and Test
    runs-on: [self-hosted, classroom-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
