<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mirai — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fdf3ea;
        color: #0a2a66;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        border: 1.5px solid #0a2a66;
        border-radius: 20px;
        background: #fff;
        padding: 32px 24px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.5;
      }
      button {
        border: 2px solid #0a2a66;
        border-radius: 999px;
        background: #d62839;
        color: #fff;
        padding: 12px 28px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .logo {
        background: #00235b;
        border-radius: 12px;
        padding: 12px 16px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="logo"
        ><img src="/mirai-logo.png" alt="Mirai" width="120"
      /></span>
      <h1>You are offline</h1>
      <p>
        Mirai needs a connection to load your students and cases. Your answers
        are saved each time you press Next, so nothing is lost.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
